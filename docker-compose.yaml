services:
  app-postgres:
    image: postgres:18.6-bookworm
    container_name: app-environment-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ${PROJECT_ROOT}/out/pgdata:/var/lib/postgresql
    restart: always

  app-postgres-migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ${PROJECT_ROOT}/migrations:/migrations

  port-forwarder:
    image: alpine/socat:1.8.1.3
    container_name: app-postgres-port-forwarder
    command: tcp-listen:5432,fork,reuseaddr tcp-connect:app-postgres:5432
    ports:
    - "127.0.0.1:5432:5432"

  loki:
    image: grafana/loki:3.7.0
    container_name: app-environment-loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.18.1
    container_name: app-environment-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./configs/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/solo-leveling:ro,consistent
      - alloy-data:/var/lib/alloy/data
    ports:
      - "127.0.0.1:12345:12345"
    depends_on:
      - loki
    restart: unless-stopped

  app:
    build:
      context: ${PROJECT_ROOT}
      dockerfile: ${PROJECT_ROOT}/cmd/app/Dockerfile
    container_name: orange-team-backend
    env_file:
      - ${PROJECT_ROOT}/.env
    environment:
      - HTTP_ADDR=:5050
      - POSTGRES_HOST=app-postgres
      - LOGGER_FOLDER=/app/logs
      - PROJECT_ROOT=/app
    volumes:
      - ${PROJECT_ROOT}/logs:/app/logs
    ports:
      - "5051:5050"
    depends_on:
      - app-postgres
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: app-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@example.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "127.0.0.1:5052:80"
    depends_on:
      - app-postgres
    restart: unless-stopped
volumes:
  alloy-data:
